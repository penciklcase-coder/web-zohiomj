<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <!--top tag нь header tag-тай тохирно-->
    <header class="top">
        <div class="logo">Миний блог</div>
        <!--class menu нь nav tag дотор багтана.-->
        <nav class="menu"><a href="#">Нүүр</a><a href="#">Тухай</a></nav>
    </header>

    <!--class content нь гол агуулга тул main tag тохирно.-->
    <main class="content">
        <!--class post нь article tag-тай тохирно. Блогийн пост нь тусад нь өөр газар байршуулсан ч утгаа алдахгүй агуулга тул section биш article ашиглана.-->
        <article class="post">
            <h2>Анхны нийтлэл</h2>
            <p>Нийтлэлийн агуулга...</p>
        </article>
        <!--class sidebar нь үндсэн агуулгатай шууд холбоогүй нэмэлт мэдээлэл тул aside tag, class bottom нь хуудасны төгсгөл тул footer tag болно.-->
        <aside class="sidebar">
            <p>Сүүлийн 5-н нийтлэл</p>
        </aside>
    </main>
    
    <footer class="bottom">
        <p>&copy; 2026 Миний блог</p>
    </footer>
</body>
</html>
